<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI模型预测 - 守护“膝”望</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 2rem;
    }
    .home-link {
        position: fixed; top: 25px; right: 25px; z-index: 1000;
        text-decoration: none; color: #3f51b5; background-color: #fff;
        border: 2px solid #3f51b5; padding: 10px 20px;
        border-radius: 50px; font-weight: 600;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease; display: inline-flex; align-items: center;
    }
    .home-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        background-color: #e8eaf6;
    }
    .home-link i { margin-right: 8px; }
    .main-container { display: flex; gap: 2rem; width: 100%; max-width: 1200px; }
    .card {
        background-color: #ffffff; border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); border: none;
        padding: 2rem; transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12); }
    .left-panel { flex: 1; }
    .right-panel { flex: 1; display: none; }
    .card-title {
        color: #1a237e; font-weight: 700; margin-bottom: 1.5rem;
        text-align: center; font-size: 1.75rem;
    }
    .upload-area {
        border: 3px dashed #7986cb; border-radius: 10px; padding: 2rem;
        text-align: center; background-color: #f8f9fa;
        cursor: pointer; transition: background-color 0.3s ease;
    }
    .upload-area:hover { background-color: #e8eaf6; }
    .upload-area i { font-size: 3rem; color: #3f51b5; }
    .upload-area p { margin-top: 1rem; color: #5c6bc0; font-weight: 500; }
    #image-preview-container { margin-top: 1.5rem; text-align: center; }
    #image-preview { max-width: 100%; max-height: 250px; border-radius: 8px; border: 1px solid #ddd; }
    .btn-custom {
        background: linear-gradient(45deg, #3f51b5, #5c6bc0);
        color: white; border: none; padding: 0.75rem 1.5rem;
        border-radius: 50px; font-weight: 600;
        transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(63, 81, 181, 0.4);
    }
    .btn-custom:hover, .btn-custom:focus {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(63, 81, 181, 0.5);
    }
    #prediction-result-container { /* Renamed for clarity */
        margin-top: 1.5rem; padding: 1.5rem; background-color: #e8eaf6;
        border-radius: 10px; display: block; /* Always visible once panel is shown */
    }
    .result-item { margin-bottom: 1rem; }
    .result-label { font-weight: 600; color: #1a237e; }
    .spinner-border { display: none; }
    #chat-modal-btn { display: none; }
    .modal-content { background-color: #f5f7fa; border-radius: 15px; }
    .modal-header { background-color: #3f51b5; color: white; border-top-left-radius: 15px; border-top-right-radius: 15px; }
    #chat-messages { height: 400px; overflow-y: auto; padding: 1rem; background-color: #fff; border-radius: 8px; }
    .message { margin-bottom: 1rem; display: flex; }
    .message.user { justify-content: flex-end; }
    .message.assistant { justify-content: flex-start; }
    .message .bubble { max-width: 80%; padding: 0.75rem 1rem; border-radius: 18px; line-height: 1.5; }
    .message.user .bubble { background-color: #3f51b5; color: white; border-bottom-right-radius: 4px; }
    .message.assistant .bubble { background-color: #e8eaf6; color: #333; border-bottom-left-radius: 4px; }
    .thinking-bubble { display: none; }
    .thinking-bubble .bubble { background-color: #e8eaf6; color: #333; font-style: italic; }
  </style>
</head>
<body>

<a href="{{ url_for('intro') }}" class="home-link">
    <i class="fas fa-home"></i> 返回首页
</a>

<div class="main-container">
  <div class="card left-panel">
    <h2 class="card-title"><i class="fas fa-bone"></i> X光片辅助诊断</h2>
    <!-- The form method/action is not strictly necessary as JS handles it, but good for non-JS fallbacks -->
    <form id="upload-form" method="POST" action="{{ url_for('prediction') }}" enctype="multipart/form-data">
      <div class="upload-area" onclick="document.getElementById('file-input').click();">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>点击此处或拖拽文件上传</p>
        <p style="font-size: 0.8rem; color: #777;">支持PNG, JPG, JPEG格式</p>
        <input type="file" id="file-input" name="file" accept="image/png, image/jpeg" style="display: none;">
      </div>
      <div id="image-preview-container" style="display: none;">
        <img id="image-preview" src="#" alt="Image Preview"/>
      </div>
      <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-custom" id="predict-btn">
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <i class="fas fa-cogs"></i> 开始预测
        </button>
      </div>
    </form>
  </div>

  <div class="card right-panel" id="result-panel">
    <h2 class="card-title"><i class="fas fa-chart-bar"></i> 诊断结果</h2>
    <div id="prediction-result-container">
        <div class="result-item">
            <span class="result-label">K-L 分级:</span>
            <span id="kl-grade-text"></span>
        </div>
        <div class="result-item">
            <span class="result-label">严重程度:</span>
            <span id="severity-label-text"></span>
        </div>
        <div class="result-item">
            <span class="result-label">模型置信度:</span>
            <span id="confidence-text"></span>
        </div>
    </div>
    <div class="mt-4 text-center">
        <button type="button" class="btn btn-custom" id="chat-modal-btn" data-bs-toggle="modal" data-bs-target="#chatModal">
            <i class="fas fa-comments"></i> 有疑问？与智能助手进一步对话
        </button>
    </div>
    <div class="mt-3 text-center">
        <a href="{{ url_for('diagnosis_rehab_options') }}" class="btn btn-link">查看对应康复方案 <i class="fas fa-arrow-right"></i></a>
    </div>
  </div>
</div>

<!-- Chat Modal -->
<div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="chatModalLabel"><i class="fas fa-robot"></i> 智能康复助手</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="chat-messages">
            <!-- Chat messages will be appended here -->
        </div>
        <div class="message assistant thinking-bubble">
          <div class="bubble">正在思考中...</div>
        </div>
      </div>
      <div class="modal-footer">
        <input type="text" id="chat-input" class="form-control" placeholder="在此输入您的问题...">
        <button id="send-btn" class="btn btn-primary"><i class="fas fa-paper-plane"></i> 发送</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- 【【【 这是修复问题的关键JavaScript代码 】】】 -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    const uploadForm = document.getElementById('upload-form');
    const fileInput = document.getElementById('file-input');
    const predictBtn = document.getElementById('predict-btn');
    const spinner = predictBtn.querySelector('.spinner-border');
    const imagePreviewContainer = document.getElementById('image-preview-container');
    const imagePreview = document.getElementById('image-preview');
    const resultPanel = document.getElementById('result-panel');
    const klGradeText = document.getElementById('kl-grade-text');
    const severityLabelText = document.getElementById('severity-label-text');
    const confidenceText = document.getElementById('confidence-text');
    const chatModalBtn = document.getElementById('chat-modal-btn');

    // For Chat
    const chatInput = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-btn');
    const chatMessages = document.getElementById('chat-messages');
    const thinkingBubble = document.querySelector('.thinking-bubble');
    let chatContext = null;

    // Handle file selection and preview
    fileInput.addEventListener('change', function () {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                imagePreview.src = e.target.result;
                imagePreviewContainer.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    // Handle form submission
    uploadForm.addEventListener('submit', function (event) {
        // ----> 1. 阻止表单的默认提交行为 (这是最关键的一步)
        event.preventDefault();

        const file = fileInput.files[0];
        if (!file) {
            alert('请先选择一个图片文件！');
            return;
        }

        // UI updates for loading state
        spinner.style.display = 'inline-block';
        predictBtn.disabled = true;

        // ----> 2. 创建 FormData 并使用 fetch 发起 POST 请求
        const formData = new FormData(uploadForm); // Automatically gets the file

        fetch("{{ url_for('prediction') }}", {
            method: 'POST',
            body: formData,
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            if (data.error) {
                alert('预测失败: ' + data.error);
                return;
            }

            // Populate results
            klGradeText.textContent = data.kl_grade;
            severityLabelText.textContent = data.severity_label;
            confidenceText.textContent = data.confidence;

            // Store context for chat
            chatContext = data.chat_context;

            // Show result panel and chat button
            resultPanel.style.display = 'block';
            chatModalBtn.style.display = 'inline-block';
            addMessage('你好！我是你的智能康复助手。AI对你上传的X光片给出了初步诊断结果，如果你有任何疑问，随时可以问我。', 'assistant');

        })
        .catch(error => {
            console.error('Fetch Error:', error);
            alert('请求失败，请检查网络连接或联系管理员。');
        })
        .finally(() => {
            // Restore UI
            spinner.style.display = 'none';
            predictBtn.disabled = false;
        });
    });

    // --- Chat Logic ---
    function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        messageDiv.appendChild(bubble);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
        const messageText = chatInput.value.trim();
        if (!messageText) return;

        addMessage(messageText, 'user');
        chatInput.value = '';
        thinkingBubble.style.display = 'flex';
        sendButton.disabled = true;

        try {
            const response = await fetch("{{ url_for('chat_with_spark') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: messageText, context: chatContext })
            });
            if (!response.ok) throw new Error('Network response was not ok.');
            const data = await response.json();
            addMessage(data.reply, 'assistant');
        } catch (error) {
            console.error('与AI助手通信失败:', error);
            addMessage('抱歉，我现在无法回答。请稍后再试。', 'assistant');
        } finally {
            thinkingBubble.style.display = 'none';
            sendButton.disabled = false;
        }
    }

    sendButton.addEventListener('click', sendMessage);
    chatInput.addEventListener('keyup', (event) => {
        if (event.key === 'Enter') {
            sendMessage();
        }
    });
});
</script>

</body>
</html>
