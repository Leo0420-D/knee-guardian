<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个性化预防建议 - 守护“膝”望</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            padding: 2rem 0;
        }

        .home-link {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 1000;
            text-decoration: none;
            color: #3f51b5;
            background-color: #fff;
            border: 2px solid #3f51b5;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
        }
        .home-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            background-color: #e8eaf6;
        }
        .home-link i {
            margin-right: 8px;
        }

        .container {
            max-width: 900px;
        }
        .advice-card {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            animation: fadeIn 1s ease-in-out;
            margin-top: 2rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-header-custom {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 1.5rem;
        }
        .card-header-custom .icon {
            font-size: 4rem;
            color: #3f51b5;
            margin-bottom: 1rem;
        }
        .card-header-custom h1 {
            font-weight: 700;
            color: #1a237e;
        }
        .advice-content {
            line-height: 1.8;
            color: #424242;
        }
        .advice-content h2, .advice-content h3 {
            color: #303f9f;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .advice-content strong { color: #1a237e; }
        .advice-content ul { padding-left: 20px; }
        .advice-content li { margin-bottom: 0.5rem; }
        .btn-container { text-align: center; margin-top: 2.5rem; }
        .btn-custom {
            background: linear-gradient(45deg, #3f51b5, #5c6bc0);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(63, 81, 181, 0.4);
            text-decoration: none;
            display: inline-block;
        }
        .btn-custom:hover, .btn-custom:focus {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(63, 81, 181, 0.5);
        }
        .modal-content { text-align: left; background-color: #f5f7fa; border-radius: 15px; }
        .modal-header { background-color: #3f51b5; color: white; border-top-left-radius: 15px; border-top-right-radius: 15px; }
        #chat-messages { height: 400px; overflow-y: auto; padding: 1rem; background-color: #fff; }
        .message { margin-bottom: 1rem; display: flex; }
        .message.user { justify-content: flex-end; }
        .message.assistant { justify-content: flex-start; }
        .message .bubble { max-width: 80%; padding: 0.75rem 1rem; border-radius: 18px; line-height: 1.5; word-wrap: break-word; }
        .message.user .bubble { background-color: #3f51b5; color: white; border-bottom-right-radius: 4px; }
        .message.assistant .bubble { background-color: #e8eaf6; color: #333; border-bottom-left-radius: 4px; }
    </style>
</head>
<body>

<a href="{{ url_for('intro') }}" class="home-link">
    <i class="fas fa-home"></i> 返回首页
</a>

<div class="container">
    <div class="advice-card">
        <div class="card-header-custom">
            <div class="icon"><i class="fas fa-user-md"></i></div>
            <h1>您的专属AI健康建议</h1>
        </div>
        <div class="advice-content">
            {{ advice|safe }}
        </div>
        <div class="btn-container">
            <button type="button" class="btn btn-custom" data-bs-toggle="modal" data-bs-target="#chatModal">
                <i class="fas fa-comments"></i> 有疑问？与智能助手进一步对话
            </button>
        </div>
    </div>
</div>

<!-- 【修复】Chat Modal 完整HTML结构 -->
<div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="chatModalLabel"><i class="fas fa-robot"></i> AI智能助手</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="chat-messages">
          <div class="message assistant">
            <div class="bubble">你好！我已根据您的问卷结果生成了以上建议。如果您对其中任何一点有疑问，或者想了解更多细节，请随时向我提问。</div>
          </div>
        </div>
        <div class="input-group mt-3">
          <input type="text" id="chat-input" class="form-control" placeholder="在此输入您的问题...">
          <button class="btn btn-primary" id="send-chat-btn"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<!-- 【修复】完整的交互JavaScript -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const chatContext = {{ chat_context|tojson|safe }};
        const chatInput = document.getElementById('chat-input');
        const sendChatBtn = document.getElementById('send-chat-btn');
        const chatMessages = document.getElementById('chat-messages');

        sendChatBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault(); // 防止回车键触发表单提交（如果存在）
                sendMessage();
            }
        });

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            messageDiv.appendChild(bubble);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        async function sendMessage() {
            const messageText = chatInput.value.trim();
            if (!messageText) return;

            addMessage(messageText, 'user');
            chatInput.value = '';
            const thinkingBubble = addMessage('正在思考中...', 'assistant');

            try {
                const response = await fetch("{{ url_for('chat_with_spark') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText, context: chatContext }),
                });

                if (!response.ok) {
                    throw new Error(`服务器错误: ${response.status}`);
                }
                const data = await response.json();
                thinkingBubble.querySelector('.bubble').textContent = data.reply;

            } catch (error) {
                console.error('与AI助手通信失败:', error);
                thinkingBubble.querySelector('.bubble').textContent = '抱歉，我现在无法回答。请稍后再试。';
            }
        }
    });
</script>

</body>
</html>
